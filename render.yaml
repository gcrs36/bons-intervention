services:
  - type: web
    name: gcrs-interventions
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: DB_PATH
        value: /var/data/database.db
      - key: DOLIBARR_URL
        value: https://dolibarr.gcrs.fr
      - key: DOLIBARR_ENTITY
        value: 1
      - key: DOLIBARR_VAT_RATE
        value: 20
      - key: DOLIBARR_API_KEY
        sync: false
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
    disk:
      name: intervention-data
      mountPath: /var/data
      sizeGB: 1
